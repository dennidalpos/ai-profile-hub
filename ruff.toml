# Bugs (F, B), syntax errors (E9), deprecated idioms (UP) and whitespace (W). Line length is not enforced.
target-version = "py311"

[lint]
select = ["E9", "F", "B", "UP", "W"]

[lint.flake8-bugbear]
extend-immutable-calls = ["PySide6.QtCore.QModelIndex", "QModelIndex"]

[lint.per-file-ignores]
"profile_switch/qt_support.py" = ["UP031"]  # the style sheet is a %-template that holds CSS braces
