name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit, branch or tag to test (blank uses the workflow commit)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=dist/evidence/tests.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os != 'Windows' && matrix.python == '3.13'
        run: |
          ./run.sh --help
          ./build.sh
      - if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: cmd
        run: |
          call run.cmd --help || exit /b 1
          call build.cmd
      - if: matrix.python == '3.13'
        run: python tools/smoke_package.py
        env:
          QT_QPA_PLATFORM: offscreen
