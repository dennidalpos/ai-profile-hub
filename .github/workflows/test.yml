name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit, branch or tag to test (blank uses the workflow commit)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create build virtual environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv

          venv.create('.venv', with_pip=True)
          scripts = Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              print(scripts, file=stream)
      - run: python -m pip install -r requirements-dev.txt
      - if: ${{ !(runner.os == 'Linux' && matrix.python == '3.13') }}
        run: python -m pytest -q --junitxml=dist/evidence/tests.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Tests with line coverage
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pytest -q --junitxml=dist/evidence/tests.xml --cov=profile_switch --cov-fail-under=76 --cov-report=term-missing:skip-covered --cov-report=xml:dist/evidence/coverage.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Keep test and coverage evidence
        if: ${{ always() && runner.os == 'Linux' && matrix.python == '3.13' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ github.sha }}
          path: dist/evidence/
          retention-days: 90
          if-no-files-found: warn
      - name: Least covered modules
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m coverage report --sort=cover --skip-covered | head -n 15 >> "$GITHUB_STEP_SUMMARY"
      - if: runner.os != 'Windows' && matrix.python == '3.13'
        run: |
          ./run.sh --help
          ./setup.sh
      - if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: cmd
        run: |
          call run.cmd --help || exit /b 1
          call setup.cmd
      - if: matrix.python == '3.13'
        run: python scripts/smoke_package.py
        env:
          QT_QPA_PLATFORM: offscreen

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.5 pip-audit==2.10.1
      - name: Lint
        run: python -m ruff check --select E9,F profile_switch scripts tests
      - name: Audit pinned dependencies
        run: python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip
