name: Release candidate evidence

# Manual only: builds the package for one commit and keeps its evidence for 90 days.
# Nothing here publishes a binary.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit, branch or tag to build (blank uses the workflow commit)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/smoke_package.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Record inventory and checksums
        run: python scripts/release_evidence.py setups/ai-profile-hub --output dist/evidence/${{ runner.os }} --commit "$(git rev-parse HEAD)"
        shell: bash
      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/evidence/${{ runner.os }}/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ runner.os }}
          path: |
            dist/evidence/${{ runner.os }}/
            setups/ai-profile-hub/
          retention-days: 90
          if-no-files-found: error
